[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linux-health-monitor"
version = "0.0.1"
description = "A beginner-friendly Linux system health monitor"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
packages = ["engine", "ui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
